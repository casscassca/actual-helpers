name: Publish and deploy to NAS

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker
  cancel-in-progress: true

jobs:
  get-version:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Fetch release version
        run: |
          curl -sL https://api.github.com/repos/actualbudget/actual/releases/latest | \
          jq -r ".tag_name" > actual-latest.txt

      - name: Check for modified files
        id: git-check
        run: echo "modified=$([ -z "$(git status --porcelain)" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Commit latest release version
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config user.name "Cassandra Meijers"
          git config user.email "cassandra.meijers@gmail.com"
          git commit -am "chore(actual): record latest actual release"
          git push

  publish-docker-image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  deploy-nas:
    needs: publish-docker-image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Pull and recreate helpers
        working-directory: /volume1/docker/actual-helpers
        run: |
          set -euo pipefail
          git pull --ff-only
          docker compose pull
          docker compose up -d
          docker image prune -f
          docker ps --filter name=actual-helpers --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
