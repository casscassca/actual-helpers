name: Publish and deploy to NAS

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker
  cancel-in-progress: true

jobs:
  update-actual:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Update Actual
        working-directory: /volume1/docker/actual
        run: |
          set -euo pipefail
          docker compose pull
          docker compose up -d
          docker inspect --format '{{.Name}} {{.Config.Image}} {{.State.Status}}' actual

  publish-docker-image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  deploy-nas:
    needs: publish-docker-image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Pull and recreate helpers
        working-directory: /volume1/docker/actual-helpers
        run: |
          set -euo pipefail
          git pull --ff-only
          docker compose pull
          docker compose up -d
          docker image prune -f
          docker ps --filter name=actual-helpers --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
