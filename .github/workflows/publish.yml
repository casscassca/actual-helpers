name: Create and publish Docker image on GHCR

on:
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: 'docker'
  cancel-in-progress: true

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  # Pulls the new image onto the Pi right after publish.
  # Required repo secrets: PI_SSH_HOST, PI_SSH_USER, PI_SSH_KEY
  # Optional: PI_SSH_PORT (default 22), PI_HELPERS_DIR (default /home/cassandrameijers/actual-helpers)
  deploy-pi:
    needs: publish-docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy new image on Pi
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.PI_HELPERS_DIR || '/home/cassandrameijers/actual-helpers' }}"
            # Host files (compose, run.sh) when you push to main
            git pull --ff-only || true
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker ps --filter name=actual-helpers --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
