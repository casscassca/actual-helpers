services:
  actual-helpers:
    container_name: actual-helpers
    image: ghcr.io/casscassca/actual-helpers:latest
    env_file: .env
    volumes:
      - ./cache:/usr/src/app/cache
      - ./data:/usr/src/app/data
      # Plaid Conf store (access tokens + Actual account mappings)
      - ${HOME}/.config/actualplaid-cli-nodejs:/home/node/.config/actualplaid-cli-nodejs
